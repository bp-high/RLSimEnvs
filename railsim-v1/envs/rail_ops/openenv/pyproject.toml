[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rail-openenv"
version = "0.1.0"
description = "OpenEnv server for rail dispatch on Groningen - Leeuwarden: MCP tools, rubric reward, task API, train-graph viewer"
requires-python = ">=3.11"
dependencies = [
    "rail-core",
    "openenv==0.7.0",
    "fastmcp>=3,<4",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
agents = ["anthropic>=1.11,<2"]
dev = ["pytest>=8", "httpx>=0.27", "rail-core[solve]"]

[tool.uv.sources]
rail-core = { path = "../core", editable = true }

[tool.setuptools.packages.find]
include = ["rail_openenv*"]

[tool.setuptools.package-data]
rail_openenv = ["web/*", "web/twin/*", "web/explorer/*"]
